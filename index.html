<title>Ab la dolchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: testo a sinistra come edizione a versi numerati, glossario a destra; su telefono i due blocchi si impilano e la barra di stato resta in alto. */
:root {
  --font-text: "Alegreya", Georgia, "Times New Roman", serif;
  --font-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --paper: #f1f2f6;
  --surface: #ffffff;
  --ink: #1b2236;
  --muted: #5a6379;
  --line: #d3d8e4;
  --lapis: #2a4699;
  --lapis-soft: #dde5f8;
  --on-lapis: #ffffff;
  --ok: #24705e;
  --ok-soft: #d8eee7;
  --err: #a8322a;
  --err-soft: #f6dcd8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151f;
    --surface: #1a1f2d;
    --ink: #e8ebf4;
    --muted: #9ba4ba;
    --line: #2d3449;
    --lapis: #93abf2;
    --lapis-soft: #26325c;
    --on-lapis: #101832;
    --ok: #5fc4a6;
    --ok-soft: #173429;
    --err: #f28b81;
    --err-soft: #40201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151f;
  --surface: #1a1f2d;
  --ink: #e8ebf4;
  --muted: #9ba4ba;
  --line: #2d3449;
  --lapis: #93abf2;
  --lapis-soft: #26325c;
  --on-lapis: #101832;
  --ok: #5fc4a6;
  --ok-soft: #173429;
  --err: #f28b81;
  --err-soft: #40201d;
  color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }

.app { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }

.intro h1 { font-family: var(--font-text); font-weight: 700; font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.intro p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 1.05rem; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-top: 20px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.prog { flex: 1 1 200px; min-width: 0; display: grid; gap: 6px; }
.lbl { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.prog-top { display: flex; align-items: baseline; gap: 10px; }
.bar strong { font-variant-numeric: tabular-nums; font-weight: 700; }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--ok); transition: width 0.3s ease; }
.errs { display: flex; align-items: baseline; gap: 10px; }
.errs strong.has { color: var(--err); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; font-weight: 500; }
.ghost:hover { border-color: var(--lapis); color: var(--lapis); }
.msg { margin: 0; min-height: 1.5em; font-size: 1.02rem; }
.msg.ok { color: var(--ok); }
.msg.no { color: var(--err); }

.grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
@media (min-width: 860px) { .grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 20px; min-width: 0; }
.panel h2 { margin: 0 0 14px; }
.panel h2 { font-family: var(--font-ui); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

.verse { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); align-items: baseline; padding-block: 4px; }
.num { font-family: var(--font-ui); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.line { font-family: var(--font-text); font-size: clamp(1.3rem, 1rem + 1.4vw, 1.75rem); line-height: 1.3; min-width: 0; }
.grp { white-space: nowrap; }
.tok { display: inline-flex; flex-direction: column; align-items: flex-start; background: transparent; border: 0; border-radius: 6px; padding: 0 3px; margin-inline: -3px; font-family: var(--font-text); font-size: inherit; line-height: inherit; text-align: left; }
.tok .w { border-bottom: 2px dotted var(--muted); }
.tok:hover:not(:disabled) { background: var(--lapis-soft); }
.tok .g { display: none; font-family: var(--font-ui); font-size: 0.58em; font-weight: 500; line-height: 1.25; color: var(--ok); padding-top: 2px; white-space: nowrap; }
.tok.sel { background: var(--lapis); color: var(--on-lapis); }
.tok.sel .w { border-bottom-color: transparent; }
.tok:disabled { cursor: default; color: var(--ink); }
.tok.solved { }
.tok.solved .w { border-bottom: 2px solid var(--ok); }
.tok.solved .g { display: block; }
.tok.wrong { background: var(--err-soft); color: var(--err); animation: shake 0.4s; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 1.08rem; line-height: 1.2; }
.chip:hover:not(:disabled) { border-color: var(--lapis); }
.chip .n { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.sel { background: var(--lapis); border-color: var(--lapis); color: var(--on-lapis); }
.chip.sel .n { color: var(--on-lapis); }
.chip.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); cursor: default; }
.chip.done::before { content: "\2713"; font-weight: 700; }
.chip.wrong { background: var(--err-soft); border-color: var(--err); color: var(--err); animation: shake 0.4s; }

.done-card { margin-top: 16px; padding: 16px 18px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.done-card h2 { margin: 0 0 2px; font-family: var(--font-text); font-size: 1.3rem; text-transform: none; letter-spacing: 0; color: inherit; font-weight: 700; }
.done-card p { margin: 0; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) {
  .tok.wrong, .chip.wrong { animation: none; }
  .fill { transition: none; }
}
</style>

<div class="app">
  <div class="intro">
    <h1>Esercitazione di occitano</h1>
    <p>Scegli una parola del testo e il termine italiano del glossario che la traduce, in qualsiasi ordine. Un'associazione sbagliata viene rifiutata; una giusta resta scritta sotto la parola.</p>
  </div>

  <div class="bar">
    <div class="bar-row">
      <div class="prog">
        <div class="prog-top"><span class="lbl">Associazioni</span><strong id="cnt">0 / 0</strong></div>
        <div class="track"><div class="fill" id="fill"></div></div>
      </div>
      <div class="errs"><span class="lbl">Errori</span><strong id="err">0</strong></div>
      <button type="button" class="ghost" id="reset">Ricomincia</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>

  <main class="grid">
    <section class="panel" aria-labelledby="h-testo">
      <h2 id="h-testo">Testo</h2>
      <div id="text"></div>
    </section>
    <section class="panel" aria-labelledby="h-glo">
      <h2 id="h-glo">Glossario</h2>
      <div class="chips" id="chips"></div>
    </section>
  </main>

  <div class="done-card" id="done" hidden>
    <div>
      <h2>Esercizio completato</h2>
      <p id="doneTxt"></p>
    </div>
    <button type="button" class="ghost" id="again">Ricomincia</button>
  </div>
</div>

<script>
/* Per riusare l'esercizio con un altro testo: cambiare TEXT e GLOSS.
   Ogni parola cliccabile e' scritta [forma nel testo|chiave del glossario].
   Forme diverse possono usare la stessa chiave (om / hom, o le due occorrenze di novel). */
var TEXT = [
  "Ab la [dolchor|dolchor] del [temps|temps] [novel|novel]",
  "[foillo|foillo] li [bosc|bosc], e li [aucel|aucel]",
  "[chanton|chanton], [chascus|chascus] en [lor|lor] [lati|lati],",
  "[segon|segon] le [vers|vers] del [novel|novel] [chan|chan]:",
  "[adonc|adonc] [esta|esta] [ben|ben] c’[om|om] [s’aisi|aisi]",
  "d’[acho|acho] [dont|dont] [hom|om] [a|a] [plus|plus] [talan|talan]."
];
var GLOSS = {
  dolchor: "dolcezza", temps: "tempo", novel: "nuovo", foillo: "mettono le foglie",
  bosc: "boschi", aucel: "uccelli", chanton: "cantano", chascus: "ciascuno",
  lor: "loro", lati: "latino", segon: "secondo", vers: "verso", chan: "canto",
  adonc: "dunque", esta: "sta", ben: "bene", om: "uomo", aisi: "gioisca",
  acho: "ciò", dont: "di cui", a: "ha", plus: "più", talan: "desiderio"
};

(function () {
  var tokens = [];      // {id, word}
  var tokBtns = [];
  var chipBtns = {};
  var total = {};       // occorrenze per chiave
  var state = { tok: null, gl: null, solved: {}, solvedCount: 0, errors: 0 };

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt) e.textContent = txt;
    return e;
  }

  /* testo */
  var textEl = $("text");
  TEXT.forEach(function (line, li) {
    var v = el("div", "verse");
    var n = el("span", "num", String(li + 1));
    n.setAttribute("aria-hidden", "true");
    var ln = el("div", "line");
    var groups = line.split(" ");
    groups.forEach(function (grp, gi) {
      var g = el("span", "grp");
      var re = /\[([^|\]]+)\|([^\]]+)\]/g;
      var last = 0, m;
      while ((m = re.exec(grp)) !== null) {
        if (m.index > last) g.appendChild(document.createTextNode(grp.slice(last, m.index)));
        var idx = tokens.length;
        tokens.push({ id: m[2], word: m[1] });
        total[m[2]] = (total[m[2]] || 0) + 1;
        var b = el("button", "tok");
        b.type = "button";
        b.appendChild(el("span", "w", m[1]));
        b.appendChild(el("span", "g"));
        b.addEventListener("click", pickTok.bind(null, idx));
        tokBtns.push(b);
        g.appendChild(b);
        last = re.lastIndex;
      }
      if (last < grp.length) g.appendChild(document.createTextNode(grp.slice(last)));
      ln.appendChild(g);
      if (gi < groups.length - 1) ln.appendChild(document.createTextNode(" "));
    });
    v.appendChild(n);
    v.appendChild(ln);
    textEl.appendChild(v);
  });

  /* glossario, in ordine alfabetico italiano */
  var chipsEl = $("chips");
  Object.keys(GLOSS).sort(function (a, b) { return GLOSS[a].localeCompare(GLOSS[b], "it"); }).forEach(function (id) {
    var c = el("button", "chip");
    c.type = "button";
    c.appendChild(el("span", "t", GLOSS[id]));
    c.appendChild(el("span", "n"));
    c.addEventListener("click", pickGl.bind(null, id));
    chipBtns[id] = c;
    chipsEl.appendChild(c);
  });

  function solvedOf(id) {
    var k = 0;
    tokens.forEach(function (t, i) { if (t.id === id && state.solved[i]) k++; });
    return k;
  }
  function remaining(id) { return total[id] - solvedOf(id); }

  function say(text, kind) {
    var m = $("msg");
    m.textContent = text;
    m.className = "msg" + (kind ? " " + kind : "");
  }
  function idleMessage() {
    if (state.tok !== null) return say("Selezionata «" + tokens[state.tok].word + "». Ora scegli il termine italiano nel glossario.");
    if (state.gl !== null) return say("Selezionato «" + GLOSS[state.gl] + "». Ora scegli la parola del testo.");
    say("Scegli una parola del testo o un termine del glossario.");
  }

  function refresh() {
    tokBtns.forEach(function (b, i) {
      var s = !!state.solved[i];
      b.disabled = s;
      b.classList.toggle("solved", s);
      b.classList.toggle("sel", state.tok === i);
      b.setAttribute("aria-pressed", state.tok === i ? "true" : "false");
      b.querySelector(".g").textContent = s ? GLOSS[tokens[i].id] : "";
    });
    Object.keys(chipBtns).forEach(function (id) {
      var c = chipBtns[id], rem = remaining(id), t = total[id];
      c.classList.toggle("done", rem === 0);
      c.classList.toggle("sel", state.gl === id);
      c.disabled = rem === 0;
      c.setAttribute("aria-pressed", state.gl === id ? "true" : "false");
      c.querySelector(".n").textContent = (t > 1 && rem > 0) ? (t - rem) + "/" + t : "";
    });
    $("cnt").textContent = state.solvedCount + " / " + tokens.length;
    $("fill").style.width = (tokens.length ? 100 * state.solvedCount / tokens.length : 0) + "%";
    var e = $("err");
    e.textContent = String(state.errors);
    e.classList.toggle("has", state.errors > 0);
  }

  function flash(i, id) {
    var a = tokBtns[i], b = chipBtns[id];
    a.classList.add("wrong");
    b.classList.add("wrong");
    setTimeout(function () { a.classList.remove("wrong"); b.classList.remove("wrong"); }, 600);
  }

  function check() {
    var i = state.tok, id = state.gl, word = tokens[i].word;
    if (tokens[i].id === id) {
      state.solved[i] = true;
      state.solvedCount++;
      state.tok = null; state.gl = null;
      refresh();
      say("Esatto: «" + word + "» = " + GLOSS[id] + ".", "ok");
      if (state.solvedCount === tokens.length) finish();
    } else {
      state.errors++;
      state.tok = null; state.gl = null;
      refresh();
      flash(i, id);
      say("No: «" + word + "» non si traduce «" + GLOSS[id] + "». Riprova.", "no");
    }
  }

  function finish() {
    var n = state.errors;
    $("doneTxt").textContent = tokens.length + " associazioni corrette, " +
      (n === 0 ? "nessun errore." : n + (n === 1 ? " errore." : " errori."));
    $("done").hidden = false;
  }

  function pickTok(i) {
    if (state.solved[i]) return;
    state.tok = state.tok === i ? null : i;
    refresh();
    if (state.tok !== null && state.gl !== null) check(); else idleMessage();
  }
  function pickGl(id) {
    if (remaining(id) === 0) return;
    state.gl = state.gl === id ? null : id;
    refresh();
    if (state.tok !== null && state.gl !== null) check(); else idleMessage();
  }

  function reset() {
    state = { tok: null, gl: null, solved: {}, solvedCount: 0, errors: 0 };
    $("done").hidden = true;
    refresh();
    idleMessage();
  }
  $("reset").addEventListener("click", reset);
  $("again").addEventListener("click", reset);

  refresh();
  idleMessage();
})();
</script>
